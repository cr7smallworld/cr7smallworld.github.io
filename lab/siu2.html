<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIUUU · 豪华版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0D1117 0%, #1A2332 50%, #0D1117 100%);
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  overflow: hidden;
}

/* ===== 舞台 ===== */
.stage {
  position: relative;
  width: 280px; height: 320px;
}

/* ===== 背光 ===== */
.spotlight {
  position: absolute;
  bottom: 60px; left: 50%; transform: translateX(-50%);
  width: 200px; height: 200px;
  background: radial-gradient(ellipse, rgba(212,168,71,0.15) 0%, transparent 70%);
  border-radius: 50%;
  animation: spotlight-pulse 1.4s ease-in-out infinite alternate;
}
@keyframes spotlight-pulse {
  0% { opacity: 0.5; transform: translateX(-50%) scale(0.85); }
  100% { opacity: 1; transform: translateX(-50%) scale(1.1); }
}

/* ===== 粒子（金色碎屑） ===== */
.particles {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute; width: 3px; height: 3px;
  background: #D4A847; border-radius: 50%;
  opacity: 0; animation: particle-fly 1.4s ease-out infinite;
}
.particle:nth-child(1)  { left: 42%; animation-delay: 0.35s; }
.particle:nth-child(2)  { left: 55%; animation-delay: 0.4s; }
.particle:nth-child(3)  { left: 38%; animation-delay: 0.45s; }
.particle:nth-child(4)  { left: 60%; animation-delay: 0.38s; }
.particle:nth-child(5)  { left: 48%; animation-delay: 0.42s; }
.particle:nth-child(6)  { left: 35%; animation-delay: 0.5s; }
.particle:nth-child(7)  { left: 62%; animation-delay: 0.36s; }
.particle:nth-child(8)  { left: 45%; animation-delay: 0.48s; }
.particle:nth-child(9)  { left: 52%; animation-delay: 0.44s; }
.particle:nth-child(10) { left: 40%; animation-delay: 0.46s; }
.particle:nth-child(11) { left: 58%; animation-delay: 0.39s; }
.particle:nth-child(12) { left: 50%; animation-delay: 0.43s; }
@keyframes particle-fly {
  0% { bottom: 100px; opacity: 0; transform: scale(0); }
  20% { opacity: 1; transform: scale(1); }
  100% { bottom: 280px; opacity: 0; transform: scale(0) translateX(var(--dx, 20px)); }
}
.particle:nth-child(odd) { --dx: -25px; }
.particle:nth-child(3n) { --dx: 30px; width: 2px; height: 2px; }
.particle:nth-child(4n) { --dx: -15px; background: #fff; width: 2px; height: 2px; }

/* ===== 人物主体 ===== */
.figure {
  position: absolute;
  bottom: 70px; left: 50%; transform: translateX(-50%);
  width: 80px; height: 140px;
  animation: fig-jump 2.8s cubic-bezier(.23,1,.32,1) infinite;
}

/* --- 头 --- */
.head {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 22px; height: 26px;
  background: #C8956C; /* 肤色 */
  border-radius: 50% 50% 48% 48%;
  z-index: 10;
}
/* 头发 */
.head::before {
  content: ''; position: absolute; top: -3px; left: -1px; right: -1px; height: 14px;
  background: #1E1E1E;
  border-radius: 12px 12px 0 0;
  clip-path: polygon(0% 40%, 8% 15%, 20% 0%, 45% 5%, 65% 0%, 85% 8%, 100% 35%, 100% 100%, 0% 100%);
}
/* 耳朵小十字架 */
.head::after {
  content: '✝'; position: absolute; top: 10px; right: -8px;
  font-size: 6px; color: #D4A847;
}

/* --- 脖子 --- */
.neck {
  position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
  width: 8px; height: 6px; background: #C8956C;
}

/* --- 躯干（球衣） --- */
.torso {
  position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
  width: 32px; height: 38px;
  background: linear-gradient(180deg, #1A1A1A 0%, #111 100%);
  border-radius: 4px 4px 2px 2px;
  z-index: 5;
}
/* 7号 */
.torso::before {
  content: '7'; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  font-family: 'Arial Black', sans-serif; font-size: 18px; font-weight: 900;
  color: #D4A847; text-shadow: 0 0 6px rgba(212,168,71,0.5);
  line-height: 1;
}
/* 衣领V字 */
.torso::after {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 7px solid transparent; border-right: 7px solid transparent;
  border-top: 8px solid #222;
}

/* --- 短裤 --- */
.shorts {
  position: absolute; top: 66px; left: 50%; transform: translateX(-50%);
  width: 30px; height: 14px;
  background: #eee;
  border-radius: 0 0 3px 3px;
  z-index: 5;
}

/* --- 手臂 --- */
.arm {
  position: absolute; top: 30px; z-index: 6;
  width: 0; height: 0;
}
/* 上臂 */
.arm-inner {
  position: relative;
  width: 6px; height: 26px;
  background: #1A1A1A; /* 球衣袖子 */
  border-radius: 3px;
  transform-origin: top center;
}
/* 前臂（肤色） */
.arm-inner::after {
  content: ''; position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
  width: 5px; height: 16px;
  background: #C8956C;
  border-radius: 3px;
}
/* 手掌 */
.hand {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  width: 6px; height: 6px;
  background: #C8956C; border-radius: 50%;
}

.arm-l { left: 10px; }
.arm-r { right: 10px; }
.arm-l .arm-inner { animation: arm-l 2.8s cubic-bezier(.23,1,.32,1) infinite; }
.arm-r .arm-inner { animation: arm-r 2.8s cubic-bezier(.23,1,.32,1) infinite; }

/* --- 腿 --- */
.leg {
  position: absolute; top: 78px; z-index: 4;
}
.thigh {
  width: 8px; height: 22px;
  background: #C8956C;
  border-radius: 4px;
  transform-origin: top center;
}
.shin {
  width: 7px; height: 20px;
  background: #C8956C;
  border-radius: 3px;
  margin-top: -1px;
}
/* 球鞋 */
.shoe {
  width: 14px; height: 7px;
  background: #111;
  border-radius: 2px 7px 3px 2px;
  margin-left: -3px;
}
/* 球袜 */
.shin::before {
  content: ''; display: block;
  width: 100%; height: 10px;
  background: #eee;
  border-radius: 3px 3px 0 0;
}

.leg-l { left: 22px; }
.leg-r { right: 22px; }
.leg-l .thigh { animation: leg-l 2.8s cubic-bezier(.23,1,.32,1) infinite; }
.leg-r .thigh { animation: leg-r 2.8s cubic-bezier(.23,1,.32,1) infinite; }

/* ===== 地面影子 ===== */
.ground-shadow {
  position: absolute;
  bottom: 58px; left: 50%; transform: translateX(-50%);
  width: 60px; height: 10px;
  background: radial-gradient(ellipse, rgba(212,168,71,0.25) 0%, transparent 70%);
  border-radius: 50%;
  animation: shadow-pulse 2.8s cubic-bezier(.23,1,.32,1) infinite;
}

/* ===== 地面线 ===== */
.ground {
  position: absolute;
  bottom: 62px; left: 20px; right: 20px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,168,71,0.2), transparent);
}

/* ===== SIUUU文字 ===== */
.siu-shout {
  position: absolute;
  top: 30px; left: 50%; transform: translateX(-50%);
  font-family: 'Arial Black', sans-serif;
  font-size: 0; font-weight: 900;
  color: #D4A847;
  text-shadow: 0 0 20px rgba(212,168,71,0.6), 0 0 40px rgba(212,168,71,0.3);
  letter-spacing: 0.15em;
  white-space: nowrap;
  opacity: 0;
  animation: shout 2.8s cubic-bezier(.23,1,.32,1) infinite;
}

/* ===== 动画关键帧 ===== */
/* 整体起跳：0%静止 → 20%蹲 → 50%最高 → 70%空中停 → 85%落地 → 100%静止 */
@keyframes fig-jump {
  0%, 18% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  22% { transform: translateX(-50%) translateY(6px) rotate(0deg); } /* 蹲 */
  28% { transform: translateX(-50%) translateY(-5px) rotate(0deg); } /* 刚离地 */
  42% { transform: translateX(-50%) translateY(-50px) rotate(0deg); } /* 空中转 */
  48%, 62% { transform: translateX(-50%) translateY(-55px) rotate(0deg); } /* 最高点停 */
  78% { transform: translateX(-50%) translateY(-8px) rotate(0deg); }
  85%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
}

/* 手臂：收着 → SIU张开 → 收回 */
@keyframes arm-l {
  0%, 18% { transform: rotate(15deg); }
  22% { transform: rotate(30deg); } /* 蹲的时候手往后 */
  42% { transform: rotate(-80deg); } /* 往上举 */
  48%, 62% { transform: rotate(-155deg); } /* SIU满开！ */
  78% { transform: rotate(-40deg); }
  85%, 100% { transform: rotate(15deg); }
}
@keyframes arm-r {
  0%, 18% { transform: rotate(-15deg); }
  22% { transform: rotate(-30deg); }
  42% { transform: rotate(80deg); }
  48%, 62% { transform: rotate(155deg); } /* SIU满开！ */
  78% { transform: rotate(40deg); }
  85%, 100% { transform: rotate(-15deg); }
}

/* 腿：并拢 → 蹲 → 跳起分开 → 叉开站 → 并拢 */
@keyframes leg-l {
  0%, 18% { transform: rotate(3deg); }
  22% { transform: rotate(18deg); } /* 蹲：膝盖弯 */
  42% { transform: rotate(-8deg); }
  48%, 62% { transform: rotate(-20deg); } /* 空中叉开 */
  78% { transform: rotate(-10deg); }
  85%, 100% { transform: rotate(3deg); }
}
@keyframes leg-r {
  0%, 18% { transform: rotate(-3deg); }
  22% { transform: rotate(-18deg); }
  42% { transform: rotate(8deg); }
  48%, 62% { transform: rotate(20deg); }
  78% { transform: rotate(10deg); }
  85%, 100% { transform: rotate(-3deg); }
}

/* 影子 */
@keyframes shadow-pulse {
  0%, 18% { transform: translateX(-50%) scaleX(1) scaleY(1); opacity: 0.8; }
  22% { transform: translateX(-50%) scaleX(1.15) scaleY(1.2); opacity: 1; } /* 蹲：影子略大 */
  42%, 62% { transform: translateX(-50%) scaleX(0.4) scaleY(0.5); opacity: 0.25; } /* 跳起：影子缩小 */
  85%, 100% { transform: translateX(-50%) scaleX(1) scaleY(1); opacity: 0.8; }
}

/* SIUUU文字：跳到最高时喊出来 */
@keyframes shout {
  0%, 38% { font-size: 0; opacity: 0; transform: translateX(-50%) translateY(0); }
  46% { font-size: 22px; opacity: 1; transform: translateX(-50%) translateY(0); }
  48%, 62% { font-size: 26px; opacity: 1; transform: translateX(-50%) translateY(-5px); }
  72% { font-size: 22px; opacity: 0.6; transform: translateX(-50%) translateY(-20px); }
  80%, 100% { font-size: 0; opacity: 0; transform: translateX(-50%) translateY(-30px); }
}

/* 聚光变化 */
@keyframes spotlight-pulse {
  0% { opacity: 0.3; transform: translateX(-50%) scale(0.8); }
  100% { opacity: 0.7; transform: translateX(-50%) scale(1.15); }
}

/* ===== 底部文字 ===== */
.bottom-text {
  margin-top: 20px;
  font-size: 0.78rem; color: rgba(255,255,255,0.3);
  text-align: center;
}
.ver-label {
  margin-top: 30px;
  padding: 6px 16px;
  font-size: 0.72rem; color: rgba(212,168,71,0.6);
  border: 1px solid rgba(212,168,71,0.15);
  border-radius: 20px;
  letter-spacing: 0.1em;
}
</style>
</head>
<body>

<div class="stage">
  <!-- 背光 -->
  <div class="spotlight"></div>

  <!-- 金色粒子 -->
  <div class="particles">
    <span class="particle"></span><span class="particle"></span>
    <span class="particle"></span><span class="particle"></span>
    <span class="particle"></span><span class="particle"></span>
    <span class="particle"></span><span class="particle"></span>
    <span class="particle"></span><span class="particle"></span>
    <span class="particle"></span><span class="particle"></span>
  </div>

  <!-- SIUUU喊声 -->
  <div class="siu-shout">SIUUU!</div>

  <!-- 人物 -->
  <div class="figure">
    <div class="head"></div>
    <div class="neck"></div>
    <div class="torso"></div>
    <div class="shorts"></div>

    <div class="arm arm-l"><div class="arm-inner"><span class="hand"></span></div></div>
    <div class="arm arm-r"><div class="arm-inner"><span class="hand"></span></div></div>

    <div class="leg leg-l">
      <div class="thigh">
        <div class="shin"><div class="shoe"></div></div>
      </div>
    </div>
    <div class="leg leg-r">
      <div class="thigh">
        <div class="shin"><div class="shoe"></div></div>
      </div>
    </div>
  </div>

  <!-- 地面 -->
  <div class="ground"></div>
  <div class="ground-shadow"></div>
</div>

<p class="ver-label">DELUXE EDITION</p>
<p class="bottom-text">CR7的小世界 · SIU加载动画 · 豪华版预览</p>

</body>
</html>
