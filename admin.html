<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>审核后台 · CR7的小世界</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261030a">
  <link rel="stylesheet" href="css/admin.css?v=20261030a">
  <link rel="stylesheet" href="css/polish.css?v=20261030a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23D4A847%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-family=%27Georgia,serif%27 font-size=%2738%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3E7%3C/text%3E%3C/svg%3E">
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">CR7的小世界</a>
      <span class="admin-tag">审核后台</span>
    </div>
  </nav>

  <main class="admin-main">

    <form class="admin-login" id="loginForm" hidden>
      <h1>站长登录</h1>
      <label>邮箱<input type="email" id="email" autocomplete="username" required></label>
      <label>密码<input type="password" id="password" autocomplete="current-password" required></label>
      <p class="admin-msg" id="loginMsg" role="status"></p>
      <button type="submit" class="admin-primary" id="loginBtn">登录</button>
    </form>

    <div id="panel" hidden>
      <div class="view-tabs" id="viewTabs">
        <button type="button" data-view="sub" class="active">投稿审核</button>
        <button type="button" data-view="fb">留言 <b id="cFbUnread">0</b></button>
      </div>
      <div id="subView">
      <div class="admin-bar">
        <div class="status-tabs" id="statusTabs">
          <button type="button" data-status="pending" class="active">待审核 <b id="cPending">0</b></button>
          <button type="button" data-status="approved">已通过 <b id="cApproved">0</b></button>
          <button type="button" data-status="rejected">未通过 <b id="cRejected">0</b></button>
          <button type="button" data-status="all">全部 <b id="cAll">0</b></button>
        </div>
        <div class="admin-tools">
          <select id="kindFilter" aria-label="投稿类型">
            <option value="">全部类型</option>
            <option value="upload">上传</option>
            <option value="supplement">补充</option>
            <option value="correction">纠错</option>
            <option value="person">新人物</option>
          </select>
          <button type="button" id="refreshBtn">刷新</button>
          <button type="button" id="logoutBtn">退出登录</button>
        </div>
      </div>
      <p class="admin-msg" id="panelMsg" role="status"></p>
      <div id="list"></div>
      </div>

      <div id="fbView" hidden>
        <div class="admin-bar">
          <div class="status-tabs" id="fbTabs">
            <button type="button" data-fb="unread" class="active">未读 <b id="cFbU">0</b></button>
            <button type="button" data-fb="read">已读 <b id="cFbR">0</b></button>
            <button type="button" data-fb="all">全部 <b id="cFbA">0</b></button>
          </div>
          <div class="admin-tools">
            <button type="button" id="fbRefresh">刷新</button>
          </div>
        </div>
        <p class="admin-msg" id="fbPanelMsg" role="status"></p>
        <div id="fbList"></div>
      </div>
    </div>

  </main>

  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="js/admin.js?v=20261030b"></script>
</body>
</html>
